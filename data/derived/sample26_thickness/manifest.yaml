# 26 块带厚度标注样片 · 照片名册（2026-08-04 到样，规格表.jpeg 人工转录）
# 照片按仓库规则不入库（本地放置 data/images/明之言检测结果/）；本名册与产物入库。
# 规格表原件即缺 5#/9#/17# 三个编号（非遗漏）；合计 26 块、28 张照片（1#/16# 中空各 2 张）。
# category: core=纯普白钢化（进厚度档统计）| special=特种片（单列不入统计）| control=未钢化对照
# thickness_mm: 单片公称厚度；中空/夹层记 null（组分见 type/notes）
# manual_quad: 检测失败/QA 不过后人工目检回填 [[x,y]×4]（原图像素坐标，左上起顺时针）；null=自动检测

photo_dir: data/images/明之言检测结果

qa:
  aniso_warn: 0.05        # 两轴 mm/px 相对差 >5% 记 warn（探针实测正常片 0.6%~3%）
  aniso_fail: 0.10        # >10% 记 fail（13# 错检实测 84%，差一个数量级）
  mm_per_px_lo: 0.5       # 合理域（本批导出缩图实测应在 0.95~1.10）
  mm_per_px_hi: 2.0

photos:
