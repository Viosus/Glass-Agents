# refs_by_thickness 初标草案（26 片带厚度批，2026-08-04）
# ⚠️ 批内极值初值（best=档内最好、worst=档内最差），非好/差样片人工标定；
#    每档 n=2~5；发档使用前须同厚度好/废片人工复标。
# 粘贴位置：GlassApp config app_config.yaml 的 app.plans.<方案名>.refs_by_thickness
#（顶层 indicators.refs_by_thickness 会被 apply_active_plan 覆盖，别粘那里）。
# 选档口径：max_thickness_mm ≥ 实测厚度 中取最小档；厚度超出全部档（如本批
# 10/12/15mm）会静默回退默认 refs——不是回退最大档。
# n=1 厚度不出档（单点无区间）：10mm(7# 均质)、12mm(14# 高应力防火)、
# 15mm(15#)——TODO(plant) 待补样后定。
# ⚠️ 映射口径变化（2026-08-05）：gray_variance/gradient_variance 的子分映射已改为
# 对数内插（indicators._LOG_SCALE_KEYS，三端同步）。厚度档 refs 仍是原始值域锚点
#（v=best→100、v=worst→0 不变），映射函数按键分域、与 refs 来源无关——本草案数值
# 无需换算；但对数域下「档内 worst=批内极值」不再意味着档内必有 0 分片。
# 对数键的 best/worst 必须为正（select_refs 选中后走同一 _sub_score，填 0 会报错）。
