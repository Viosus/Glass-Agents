# 应力斑分布打分 · 可调参数（算法参数，非国标限值，不属于 TODO(plant)）
# 由 fringe_scoring/ 在每次调用时读取——改这里即时生效，无需改代码。
# 每个键的含义与"调大/调小"的效果见 docs/应力斑分布打分_需求与设计.md §4 调参指南。

indicators:                   # 六指标测量与加权总分（决策#14；统计域=矫正片内部扣细圈边框带）
  weights:                    # 加权权重（工厂可调；默认平权，2026-07-03 需求）
    x095: 1.0                 # 95% 分位光程差（未标定=灰度代理）
    gray_variance: 1.0        # 灰度方差
    gradient_mean: 1.0        # 梯度均值（Sobel 幅值）
    gradient_variance: 1.0    # 梯度方差
    ccp: 1.0                  # 组合纹理特征
    position_score: 1.0       # 应力斑位置评分（斑纹空间分布，与深浅解耦；原"uniformity/均匀度"，2026-07-19 改名）
  scoring:                    # 位置指标·评分层（指标层只出中心集中度 ρu，不读本段）
    position_ratio_at_zero: 0.33  # 位置评分刻度锚 ρ0（ρu 达该值→0 分；0.33≈中心满斑理论上限；原 uniformity_ratio_at_zero）
  baseline_flip:              # 基准翻转门闩（2026-07-19，仅位置指标路径；修"斑过半→中位数落斑内→跳分"）
    enabled: true             # false=恒走单遍（旧行为，供与历史结果对拍）
    p_flip: 0.05              # 触发阈=暗尾占比 p_dark 超此判翻转（未标定，工程初值 TODO(plant)）
    q_lo: 0.25                # 暗侧子总体分位 q 下限（未标定；任务书初值 0.05，按 T6 边界实测上调——见 segment.BASELINE_FLIP_Q_LO 注释）
    q_max: 0.5                # q 上限：不越过中位（未标定）
    min_dark_abs: 1000        # 暗侧样本绝对下限，不足则回退置 aborted（未标定）
    min_dark_frac: 0.005      # 暗侧样本相对下限 ×|M|（未标定）
  position_segment:           # 位置指标专属掩膜口径（2026-07-08 需求：与"斑纹判定"解耦——主 segment 的
    top_fraction: 0.15        #   判定参数 min_dev_gray/top_fraction/min_z 等怎么调都不影响位置指标）。
    min_z: 2.5                #   本段缺省时代码取同值内置口径；数值=历史默认，一般无需改动。
    z_saturation: 8.0         #   背景估计/边框带参数不在此列（那是背景不是判斑，仍与主配置共享）
    polarity: bright          #   （旧键名 uniformity_segment 代码仍识别，deprecated）
  refs:                       # 子分映射参考：s=clip(100×(worst−v)/(worst−best))。
                              # 初值=本批 25 片好/差片实测中位（2026-07-03），工厂按自家口径调
    x095: {best: 20.0, worst: 210.0}
    gray_variance: {best: 50.0, worst: 4000.0}
    gradient_mean: {best: 5.0, worst: 32.0}
    gradient_variance: {best: 30.0, worst: 1100.0}
    ccp: {best: 0.2, worst: 1.4}    # 2026-07-13 拍板标尺：ccp 子分特例——优于 best 溢出 >100、劣于 worst 封 0（indicators._OVERFLOW_KEYS）
    position_score: {best: 100.0, worst: 0.0}  # 越大越好方向（best>worst 公式自动同向）；默认等价直通
  # refs_by_thickness:        # 可选：按厚度分档的参考值（厚玻璃天生斑重，须与同厚度参考比才公平；
  #   - max_thickness_mm: 6   #   机制同国标分级表"≤该厚度适用"。各档数值须用同厚度好/差样片标定，
  #     refs:                 #   TODO(plant)：当前样片厚度未知，无法给任何档的真值——绝不臆造）
  #       x095: {best: TODO(plant), worst: TODO(plant)}
  #       ...
  #   - max_thickness_mm: 10
  #     refs: ...
  calibration:                # 标定项（2026-07-03 拍板：未标定用灰度/像素代理并标注，到位填值即切换）
    gray_to_nm: null          # 灰度→光程差 nm 系数；null=X0.95 输出灰度代理（同设备可比）
    mm_per_px: null           # 空间标定；null=CCP 按原始像素（跨设备不可比，同设备可比）
    ccp_c_max: 0.10           # CCP 参考 Cmax；初值=本批最差片实测（非国标参考样品标定）
    ccp_cp_max: 700.0         # CCP 参考 CPmax；同上
    ccp_reference_is_plant_calibrated: false  # 参考样品现场标定完成后置 true
    thickness_mm: null        # TODO(plant) 玻璃厚度未知（照片名 0MM）；国标评估区域/判级需要

scoring:                      # 输出刻度（人工校准锚，纯单调映射不改排序）
  penalty_ratio_at_zero: 0.45 # 罚分比 ρ=penalty_raw/penalty_max 达该值 → 0 分。标定依据（2026-07-03，
                              # 决策#13 暗地板锚+边框超宽计罚口径下）：人工判废三片 ρ=0.265/0.317/0.324
                              # → 41/30/28 分（<50，余量 9）；好片 ρ≤0.029 → ≥93.6；可行窗 [0.193,0.531]，
                              # 取 0.45 使未经人工判定的中段片（ρ 0.04–0.16 → 64–92）离两侧边界都远。
                              # 缺省 1.0=旧行为（理论最差归一，分数压在高位）

sheets:                       # 整床多片切分（一张照片多块玻璃；暗背景、片边缘偏亮、背景占比≥bg_quantile 为前提）
  edge_trim_frac: 0.002       # 检测前裁掉外圈条带占短边比例（至少 1px；实测照片首末行有 1px 亮线 artifact）
  bg_quantile: 0.25           # 背景水平 = 全图该分位数（比中位数稳健：只要背景占比 ≥ 该值）
  fg_min_z: 6.0               # 前景阈值项①：背景 + 该倍数 × 暗侧稳健尺度
  fg_min_rel: 0.25            # 前景阈值项②：背景 + 该比例 × (亮参考分位数 − 背景)；两项取大。
                              # 实测 ≥0.2 才能断开相邻片边缘辉光的粘连桥，0.2–0.5 计数稳定 → 取 0.25 留双侧余量
  bright_ref_quantile: 0.995  # 亮参考分位数（项②的锚，避开个别饱和像素）
  close_frac: 0.005           # 闭运算核边长 ≈ 短边 × 该比例（连补片边亮线断点；过大会把相邻片粘连）
  min_area_frac: 0.01         # 单片最小面积占整图（裁边后）比例，低于视为杂物/反光忽略
  min_side_frac: 0.05         # 单片最小边长（minAreaRect 短边）占短边比例，低于视为亮线纹/细条干扰剔除
  max_sheets: 50              # 检出片数上限，超出判过分割 → 报错不打分
  poly_epsilon_frac: 0.02     # 逐片四角拟合 approxPolyDP 的 epsilon = 凸包周长 × 该比例

quad:                         # 四边形玻璃检测与透视矫正（大图裁切，玻璃可能非正矩形）
  auto_detect: true           # 自动检测玻璃四边形并矫正成矩形；false=沿用"整图即玻璃"
  fill_tol_frac: 0.05         # 填充判定容差 = 图像稳健尺度 × 该比例
  min_fill_border_frac: 0.2   # 边界一圈的"恒定填充尖峰"占比低于此 → 判无填充（整图即玻璃）
  full_frame_frac: 0.99       # 玻璃占比 ≥ 该值视为整图即玻璃，跳过矫正
  min_glass_frac: 0.5         # 玻璃占比 < 该值（且非近恒定图）判检测异常 → 报错不打分
  poly_epsilon_frac: 0.02     # 四角拟合 approxPolyDP 的 epsilon = 凸包周长 × 该比例

segment:
  method: gray_threshold      # 斑判定：gray_threshold(默认，|残差|≥min_dev_gray 全算，面积不封顶——
                              #   斑铺得越大罚越多，决策#12) | quantile(取最深 top_fraction，面积≤top_fraction
                              #   会轻判"又深又大"，仅对照用) | robust_z(固定 z 阈值)
  top_fraction: 0.15          # quantile 法：斑占有效区面积的经验比例，建议 0.10–0.20
  min_z: 2.5                  # z 域方法的质控下限：top-q 且 |z|≥该值才算斑（纯噪声不计罚）
  polarity: bright            # 斑相对背景的极性。bright=只算偏亮（决策#12：暗场偏光成像的物理——无应力=暗、
                              #   有应力=亮；同时杜绝"斑占多数时背景面漂移把干净暗区反标成斑"） | both | dark
  z_threshold: 3.0            # robust_z 法：|z| 超过该值判为斑
  s_scale_mode: absolute      # 深浅 s 的尺度锚：absolute=固定灰度饱和（跨片可比；前提=同批曝光固定）
                              # | per_sheet=每片自身 MAD（旧行为）。per_sheet 已实测在"整片重斑"上
                              # 排序反转（斑撑大自身尺度→漏罚，2026-07-02 决策#11），仅曝光不可控时退用
  s_saturation_gray: 200      # absolute 模式 s 顶满的 |残差| 灰度值。按 2026-07 实测批次（400US/F4/255）
                              # 定：最重斑片斑内 p99≈200–228、最淡片≈64；换曝光/相机需重标此值
  min_dev_gray: 10            # absolute 模式计罚质控下限（灰度）：top-q 且 |残差|≥该值才算斑
                              # （对应 per_sheet 的 min_z；实测最淡片内部 p50≈1.6–2.2、传感噪声量级个位数）
                              # ⚠️ 决策#13 刻度锚 penalty_ratio_at_zero=0.45 按本值标定，重标锚前勿改；
                              # GlassApp 侧按"肉眼可见"口径用 30（只为二值图展示，不进总分）
  z_saturation: 8.0           # per_sheet 模式：深浅强度 s 封顶的 z 值（锚定统一 z 尺度）
  background_block_frac: 0.05 # 背景拟合的分块边长 ≈ 内部短边 × 该比例
  background_block_quantile: 0.15  # 块内统计分位：0.15=暗地板锚（决策#13，配 polarity=bright——高频亮
                              #   条纹块内必有暗隙，低分位落在暗地板 → 整片布满亮斑时背景不被抬高，
                              #   扫除"均匀饱和盲区"）；0.5=中位数旧口径。dev_gray 居中取同一分位
  background_poly_degree: 1   # 背景曲面多项式次数：1=平面(默认，稳)；2=二次曲面——
                              # 仅当照度明显弯曲时用：宽斑会污染曲率项（穹顶假象），需目检确认
  min_contrast_frac: 0.05     # 残差稳健尺度 < 图像整体稳健尺度 × 该比例 → 判"无斑"（防数值噪声放大）

border:                       # 四边各自自适应检测边框重应力斑带
  min_band_frac: 0.0          # 带宽下限（占对应边长比例）
  max_band_frac: 0.25         # 带宽上限（占对应边长比例，保护阈）
  normal_band_frac: 0.04      # 正常边框带允许宽度（占对应边长比例）：细圈是物理正常 → 免罚；
                              #   超出部分是质量缺陷 → 按普通斑计罚（决策#13，人工语义确认；
                              #   25 片实测好片带宽 0.01–0.04）。不设此键 = 整带免罚旧口径
  profile_quantile: 0.5       # 每行/列取该分位数作 1D 剖面（0.5=中位数，对内部斑污染最稳健；
                              # 边框不连续/只占行列一部分时调高，如 0.75，更敏感但易受内部斑干扰）
  return_to_background_ratio: 2.0  # |去趋势剖面| 回落到内部波动(稳健σ)×该倍数以下 → 边框带到此为止

weight:                       # 位置惩罚权重 w(r)：中心最重、越远越轻
  kind: linear                # linear(=1-r) | gaussian(=exp(-r^2/2σ^2))
  gaussian_sigma: 0.5         # gaussian 形状的"中心区半径"（r∈[0,1] 的单位）
  floor: 0.3                  # 边缘权重下限 w=max(形状值,floor)：边缘重斑不免罚（决策#12——
                              #   人工锚点：斑集中边缘的 235705 判不及格）；中心>边缘次序不变
  distance_norm: chebyshev    # 距离口径：chebyshev(默认，同心矩形等罚线——经透视矫正映射回
                              # 原图即"同心四边形"等高线) | euclidean(椭圆/圆形等罚线)
