    zone_count: TODO(plant)           # 待铭牌/现场确认
    zone_layout: TODO(plant)
    fan_count: TODO(plant)
    nameplate: {}
    commissioning_date: TODO(plant)   # 投产日期（台账）
    last_overhaul_date: TODO(plant)
    recorded_at: null
