# review.py 确定性预检规则（AST/正则通道读取；纯数据，禁硬编码进 tools/，符合铁律 #4）
# 改这里即时生效（review.py 每次运行按需读取），无需改代码。

# 1) 云端调用——import 黑名单（按模块根名精确匹配 import / from ... import）
cloud_import_blacklist:
  - openai
  - anthropic
  - requests
  - urllib
  - http          # http.client
  - httpx
  - aiohttp
  - socket
  - websocket
  - websockets
  - ftplib
  - smtplib
  - telnetlib
  - boto3
  - cohere

# 云端调用——带点号的命名空间包（按前缀匹配，如 google.generativeai.xxx）
cloud_import_blacklist_dotted:
  - google.generativeai

# 2) 云端调用——出现即违规的字面子串（大小写不敏感，按行扫描）
cloud_string_patterns:
  - "https://"
  - "http://"
  - "api.openai.com"
  - "api.anthropic.com"
  - "api_key"
  - "base_url"

# 2b) 云端调用豁免路径（仅豁免「云端调用」类规则；中文注释/命名铁律照查）。
#     GlassApp 是联网客户端/服务器产品（打分服务器、账号服务、桌面上传器），其联网层
#     出现 base_url / http / requests 属产品本职，非数据外泄面。Glass Agents 仓库
#     任何文件都不在豁免内——机密数据层禁联网护栏不变。2026-08-04 经用户拍板加入。
#     条目为路径前缀（正/反斜杠均可，大小写不敏感）；目录以 / 结尾。
cloud_exempt_paths:
  - "D:/GlassApp/server/"
  - "D:/GlassApp/app/uploader.py"
  - "D:/GlassApp/app/config_store.py"
  - "D:/GlassApp/app/settings_page.py"

# 3) 命名铁律——受批准的大写记号（CONVENTIONS.md §2/§3），命名检查时豁免。
#    末尾两项为 Qt 框架强制的虚函数覆写名（GlassApp 界面层）：重命名即失效，非风格违规。
approved_uppercase_names:
  - L
  - W
  - T
  - L_mm
  - W_mm
  - La
  - Wa
  - R_px
  - Ng
  - Ca
  - CPa
  - Cmax
  - CPmax
  - A_max
  # Qt 框架强制的虚函数覆写名（GlassApp 界面层；重命名即失效，非本仓命名铁律适用对象）
  - dragEnterEvent
  - dropEvent
  - wheelEvent
  - mousePressEvent
  - mouseDoubleClickEvent
  - resizeEvent
  - showEvent
  - paintEvent
